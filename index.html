              </section>

              {/* RIGHT PANEL: Live SMART Discovery JSON Inspector */}
              <aside className="lg:col-span-5 flex flex-col bg-slate-900/70 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div className="p-4 border-b border-slate-800 bg-slate-950/60 space-y-3">
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <FileJson className="w-4 h-4 text-sky-400" />
                      <span className="text-xs font-bold text-white font-mono">
                        /.well-known/smart-configuration
                      </span>
                    </div>
                    <button
                      onClick={() => setIsPrettyPrint(!isPrettyPrint)}
                      className={`px-2.5 py-1 rounded-md text-[11px] font-semibold border transition ${
                        isPrettyPrint
                          ? "bg-sky-500/15 text-sky-300 border-sky-500/30"
                          : "bg-slate-800 text-slate-400 border-slate-700"
                      }`}
                    >
                      {isPrettyPrint ? "Pretty-Print: ON" : "Raw 1-Line"}
                    </button>
                  </div>

                  <div className="relative">
                    <Search className="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={jsonSearch}
                      onChange={(e) => setJsonSearch(e.target.value)}
                      placeholder="Search fields or scopes (e.g., Observation.rs, S256)..."
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-8 py-1.5 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-sky-500"
                    />
                    {jsonSearch && (
                      <button
                        onClick={() => setJsonSearch("")}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                      >
                        <X className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>

                  {selectedJsonKey && FIELD_TOOLTIPS[selectedJsonKey] && (
                    <div className="p-2.5 rounded-lg bg-sky-950/40 border border-sky-500/30 text-[11px] text-sky-200 flex items-start gap-2">
                      <Info className="w-4 h-4 text-sky-400 shrink-0 mt-0.5" />
                      <div>
                        <span className="font-mono font-bold text-white">
                          "{selectedJsonKey}":
                        </span>{" "}
                        {FIELD_TOOLTIPS[selectedJsonKey]}
                      </div>
                    </div>
                  )}
                </div>

                <div className="json-scroll p-4 font-mono text-xs overflow-y-auto max-h-[540px] flex-1 bg-slate-950/40">
                  {!isPrettyPrint ? (
                    <div className="break-all text-slate-400 leading-relaxed select-all">
                      {JSON.stringify(SMART_CONFIG)}
                    </div>
                  ) : (
                    <div className="space-y-1.5">
                      <div className="text-slate-500">{"{"}</div>
                      {Object.entries(SMART_CONFIG).map(([key, value]) => {
                        const isHighlighted = currentStep.highlightKeys.includes(key);
                        const isScopesArray = key === "scopes_supported";
                        const listToRender = isScopesArray ? displayedScopes : value;

                        return (
                          <div
                            key={key}
                            onClick={() => setSelectedJsonKey(key)}
                            className={`pl-3 py-1 rounded-lg cursor-pointer transition border ${
                              isHighlighted
                                ? "bg-sky-500/10 border-sky-500/40"
                                : "border-transparent hover:bg-slate-900/80"
                            }`}
                          >
                            {!Array.isArray(value) ? (
                              <div>
                                <span className="text-sky-300 font-semibold">
                                  "{key}"
                                </span>
                                <span className="text-slate-400">: </span>
                                <span className="text-emerald-300 break-all">
                                  "{value}"
                                </span>
                                <span className="text-slate-500">,</span>
                              </div>
                            ) : (
                              <div>
                                <div className="flex items-center justify-between pr-2">
                                  <div>
                                    <span className="text-sky-300 font-semibold">
                                      "{key}"
                                    </span>
                                    <span className="text-slate-400">: [</span>
                                  </div>
                                  {isScopesArray && (
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setShowAllScopesInJson(!showAllScopesInJson);
                                      }}
                                      className="text-[10px] font-sans px-2 py-0.5 rounded bg-slate-800 text-sky-300 hover:bg-slate-700"
                                    >
                                      {showAllScopesInJson
                                        ? "Show Key Lab Scopes (15)"
                                        : `Show All (${SMART_CONFIG.scopes_supported.length})`}
                                    </button>
                                  )}
                                </div>
                                <div className="pl-4 space-y-0.5 my-1">
                                  {listToRender.map((item, idx) => {
                                    const isScopeHighlighted =
                                      currentStep.highlightScopes.includes(item) ||
                                      (jsonSearch &&
                                        item
                                          .toLowerCase()
                                          .includes(jsonSearch.toLowerCase()));
                                    return (
                                      <div
                                        key={item}
                                        className={`px-1.5 py-0.5 rounded ${
                                          isScopeHighlighted
                                            ? "bg-amber-500/20 text-amber-200 font-bold border border-amber-500/40"
                                            : "text-emerald-300"
                                        }`}
                                      >
                                        "{item}"
                                        {idx < listToRender.length - 1 ? "," : ""}
                                      </div>
                                    );
                                  })}
                                </div>
                                <div className="text-slate-400">],</div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                      <div className="text-slate-500">{"}"}</div>
                    </div>
                  )}
                </div>
              </aside>
            </main>
          )}

          {/* FLOATING GLOSSARY BUTTON (Bottom-Right, persistent across all tabs) */}
          <button
            onClick={() => setGlossaryOpen(true)}
            className="fixed bottom-6 right-6 z-40 px-4 py-2.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-2xl shadow-indigo-600/40 border border-indigo-400/40 flex items-center gap-2 transition transform hover:scale-105"
            title="Open SMART on FHIR Technical Glossary (79 Terms)"
          >
            <BookMarked className="w-4 h-4" />
            <span>Glossary</span>
            <span className="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-[10px] font-mono">
              79
            </span>
          </button>

          {/* SLIDE-UP GLOSSARY MODAL / DRAWER */}
          {glossaryOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm p-2 sm:p-4 animate-fadeIn">
              <div
                className="w-full max-w-3xl max-h-[85vh] bg-slate-900 border border-slate-700 rounded-2xl flex flex-col shadow-2xl overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Glossary Header & Search Input */}
                <div className="p-4 border-b border-slate-800 bg-slate-950/80 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                        <BookMarked className="w-4 h-4" />
                      </div>
                      <div>
                        <h3 className="font-bold text-sm text-white">
                          SMART on FHIR Technical Glossary
                        </h3>
                        <p className="text-[11px] text-slate-400">
                          79 terms &mdash; acronyms &middot; scopes &middot; claims &middot; endpoints &middot; workflows
                        </p>
                      </div>
                    </div>
                    <button
                      onClick={() => setGlossaryOpen(false)}
                      className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition"
                      title="Close Glossary (or press Escape)"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="relative">
                    <Search className="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={glossarySearch}
                      onChange={(e) => setGlossarySearch(e.target.value)}
                      placeholder="Search glossary terms (e.g., fhirUser, S256, need_patient_banner, aud)..."
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-8 pr-8 py-2 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-indigo-500"
                      autoFocus
                    />
                    {glossarySearch && (
                      <button
                        onClick={() => setGlossarySearch("")}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                      >
                        <X className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>

                  {/* Category Filter Pills */}
                  <div className="flex flex-wrap gap-1.5 pt-1">
                    {GLOSSARY_CATEGORIES.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setGlossaryCategory(cat)}
                        className={"px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition " + (
                          glossaryCategory === cat
                            ? "bg-indigo-500 text-white border-indigo-400"
                            : "bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-600 hover:text-slate-200"
                        )}
                      >
                        {cat === "All" ? "All (" + GLOSSARY_TERMS.length + ")" : cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Glossary Terms List */}
                <div className="p-4 overflow-y-auto space-y-2.5 flex-1 bg-slate-950/40">
                  {filteredGlossary.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-xs">
                      No terms match &ldquo;{glossarySearch}&rdquo;{glossaryCategory !== "All" ? ` in category "${glossaryCategory}"` : ""}.
                    </div>
                  ) : (
                    filteredGlossary.map((item) => (
                      <div
                        key={item.term}
                        className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800/90 space-y-1 text-xs hover:border-slate-700 transition"
                      >
                        <div className="flex items-center justify-between gap-2">
                          <span className="font-mono font-bold text-sky-300 text-sm">
                            {item.term}
                          </span>
                          <span className="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400 font-mono">
                            {item.category}
                          </span>
                        </div>
                        <p className="text-slate-300 leading-relaxed text-[11px]">
                          {item.def}
                        </p>
                      </div>
                    ))
                  )}
                </div>

                {/* Glossary Footer */}
                <div className="p-3 border-t border-slate-800 bg-slate-950 flex items-center justify-between text-[11px] text-slate-500">
                  <span>Showing {filteredGlossary.length} of {GLOSSARY_TERMS.length} terms{glossaryCategory !== "All" ? ` in "${glossaryCategory}"` : ""}</span>
                  <span>Press <kbd className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">ESC</kbd> to exit</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
