      outline: 2px solid #38bdf8;
      outline-offset: 2px;

    /* Progress bar animation */
    .progress-bar { transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }

                                          accessTokenFormat === "opaque"
                                            ? `st_live_opaque_gen${tokenGeneration}_99a8b7`
                                            : `eyJhbGciOiJSUzI1NiIsImtpZCI6InNtYXJ0LWtleS0xIiwiZ2VuIjoidj${tokenGeneration}ifQ...`,
                                        token_type: "Bearer",
                                        expires_in: 3600,
                                        scope: grantedScopesList.join(" "),
                                        patient: "pat-mother-eleanor-456",
                                        need_patient_banner: true,
                                        id_token:
                                          "eyJraWQiOiJzbWFydC1rZXktMSIs... (fhirUser: RelatedPerson/john-42)",
                                        ...(simScopes.includes("offline_access")
                                          ? {
                                              refresh_token: `rt_live_88a9c0_gen${tokenGeneration}`
                                            }
                                          : {})
                                      },
                                  null,
                                  2
                                )}
                              </pre>
                            </div>
                          )}
                        </div>
                      )}

                      {simStage === 4 && (
                        <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] space-y-2">
                          {selectedSeqStepNum >= 16 ? (
                            <div className="space-y-1.5">
                              <div className="text-emerald-400 font-bold">
                                HTTP/1.1 200 OK (Step 18 Refresh Token Rotated!)
                              </div>
                              <pre className="text-emerald-300 whitespace-pre-wrap">
                                {JSON.stringify(
                                  {
                                    access_token: `eyJhbGciOiJSUzI1NiIsImdlbiI6InY${tokenGeneration}i...`,
                                    token_type: "Bearer",
                                    expires_in: 3600,
                                    scope: grantedScopesList.join(" "),
                                    patient: "pat-mother-eleanor-456",
                                    refresh_token: `rt_live_88a9c0_gen${tokenGeneration}`
                                  },
                                  null,
                                  2
                                )}
                              </pre>
                            </div>
                          ) : tokenExpired ? (
                            <div className="space-y-1.5">
                              <div className="text-rose-400 font-bold">
                                HTTP/1.1 401 Unauthorized (Failed at Epic Step 13 — Token Expired)
                              </div>
                              <div className="text-amber-300">
                                WWW-Authenticate: Bearer error="invalid_token", error_description="The access token expired (exp claim is in the past)"
                              </div>
                              <pre className="text-rose-300 whitespace-pre-wrap">
                                {JSON.stringify(
                                  {
                                    resourceType: "OperationOutcome",
                                    issue: [
                                      {
                                        severity: "error",
                                        code: "expired",
                                        diagnostics:
                                          "Access token TTL (3600s) elapsed. Use your refresh_token at /smart/token (Steps 16-18) to obtain a new access_token."
                                      }
                                    ]
                                  },
                                  null,
                                  2
                                )}
                              </pre>
                            </div>
                          ) : fhirApiResult === "wrong_id_token" ? (
                            <div className="space-y-1.5">
                              <div className="text-rose-400 font-bold">
                                HTTP/1.1 401 Unauthorized (LoginRadius Mistake #1: ID Token Sent to API!)
                              </div>
                              <pre className="text-rose-300 whitespace-pre-wrap">
                                {JSON.stringify(
                                  {
                                    error: "invalid_token",
                                    error_description:
                                      "Token validation failed at Step 13: Audience ('aud': 'john-graph-app') does not match FHIR Resource Server ('https://api.mock.health/fhir') and token contains no 'scope' claim. Never send an id_token as a Bearer token!"
                                  },
                                  null,
                                  2
                                )}
                              </pre>
                            </div>
                          ) : fhirApiResult === "ui_access_token_mistake" ? (
                            <div className="space-y-1.5">
                              <div className="text-amber-400 font-bold">
                                App UI Warning (LoginRadius Mistake #2: Reading Access Token for Identity)
                              </div>
                              <p className="text-slate-300 font-sans">
                                Access tokens are meant for the <strong>FHIR Resource Server</strong>, not for the client app to identify the logged-in user! If the server issues an <strong>Opaque Access Token</strong> (`st_live_opaque...`), your app cannot decode it at all. Always read user identity (`fhirUser`, `name`) from the <strong>`id_token`</strong>.
                              </p>
                            </div>
                          ) : fhirApiResult === "delete_obs" ? (
                            <div className="space-y-1.5">
                              <div className="text-rose-400 font-bold">
                                HTTP/1.1 403 Forbidden (Insufficient Scope at Step 13)
                              </div>
                              <pre className="text-rose-300 whitespace-pre-wrap">
                                {JSON.stringify(
                                  {
                                    resourceType: "OperationOutcome",
                                    issue: [
                                      {
                                        severity: "error",
                                        code: "forbidden",
                                        diagnostics:
                                          "Access token granted 'patient/Observation.rs' (read/search only). 'd' (delete) permission was not granted."
                                      }
                                    ]
                                  },
                                  null,
                                  2
                                )}
                              </pre>
                            </div>
                          ) : (
                            <div className="space-y-1.5">
                              <div className="text-emerald-400 font-bold">
                                HTTP/1.1 200 OK (Epic Step 14 • Generation #{tokenGeneration} Token Verified)
                              </div>
                              <pre className="text-emerald-300 whitespace-pre-wrap">
                                {JSON.stringify(
                                  {
                                    resourceType: "Bundle",
                                    type: "searchset",
                                    total: 1,
                                    entry: [
                                      {
                                        resource: {
                                          resourceType: "Observation",
                                          id: "hba1c-992",
                                          subject: {
                                            reference: "Patient/pat-mother-eleanor-456"
                                          },
                                          encounter:
                                            launchMode === "ehr"
                                              ? { reference: "Encounter/enc-ed-triage-8821" }
                                              : undefined,
                                          code: { text: "Hemoglobin A1c" },
                                          valueQuantity: { value: 6.8, unit: "%" }
                                        }
                                      }
                                    ]
                                  },
                                  null,
                                  2
                                )}
                              </pre>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* TAB 4: TOKEN DEEP-DIVE LAB */}
          {activeTab === "tokens" && (
            <main className="tab-panel max-w-7xl w-full mx-auto flex-1 flex flex-col gap-6 p-4 sm:p-6">
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-5">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md text-xs font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30 mb-1">
                      <KeyRound className="w-3.5 h-3.5" />
                      LoginRadius Visual Architecture + OIDC & OAuth 2.0 Token Separation
                    </span>
                    <h2 className="text-xl font-bold text-white">
                      ID Token vs. Access Token vs. SMART Launch Context
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Understand why <strong>Authentication (Who signed in?)</strong>, <strong>Authorization (What data can the app access?)</strong>, and <strong>Context (Whose chart is open?)</strong> use separate tokens and parameters.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      setAuthCompleted(true);
                      setTamperMode("valid");
                      setTokenExchangeResult("success");
                      setSelectedSeqStepNum(11);
                      setSimStage(3);
                      setActiveTab("simulator");
                    }}
                    className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shrink-0 transition shadow-lg shadow-emerald-500/20 flex items-center gap-1.5"
                  >
                    <span>Test in Live Simulator</span>
                    <ArrowRight className="w-4 h-4" />
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                  <div
                    onClick={() => setDeepDiveTokenFocus("id_token")}
                    className={`p-4 rounded-2xl border cursor-pointer transition space-y-2 ${
                      deepDiveTokenFocus === "id_token"
                        ? "bg-indigo-950/40 border-indigo-400 shadow-lg shadow-indigo-500/10"
                        : "bg-slate-950 border-slate-800 hover:border-slate-700"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-bold">
                        Path A • Authentication
                      </span>
                      <User className="w-4 h-4 text-indigo-400" />
                    </div>
                    <div className="text-base font-bold text-white">
                      1. ID Token (`id_token`)
                    </div>
                    <p className="text-slate-300">
                      <strong>Requested via:</strong> <code className="text-indigo-300">openid fhirUser</code>
                    </p>
                    <p className="text-slate-400">
                      <strong>Consumed by:</strong> The <strong>Client Application UI</strong>. Tells the app who authenticated (e.g., John the caregiver or Dr. Smith the clinician).
                    </p>
                    <div className="p-2 rounded bg-slate-900 border border-slate-800 font-mono text-[11px] text-indigo-200">
                      aud: "john-graph-app" (The App!)
                    </div>
                  </div>

                  <div
                    onClick={() => setDeepDiveTokenFocus("access_token")}
                    className={`p-4 rounded-2xl border cursor-pointer transition space-y-2 ${
                      deepDiveTokenFocus === "access_token"
                        ? "bg-emerald-950/40 border-emerald-400 shadow-lg shadow-emerald-500/10"
                        : "bg-slate-950 border-slate-800 hover:border-slate-700"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">
                        Path B • Authorization
                      </span>
                      <Key className="w-4 h-4 text-emerald-400" />
                    </div>
                    <div className="text-base font-bold text-white">
                      2. Access Token (`access_token`)
                    </div>
                    <p className="text-slate-300">
                      <strong>Requested via:</strong> <code className="text-emerald-300">patient/Observation.rs</code>
                    </p>
                    <p className="text-slate-400">
                      <strong>Consumed by:</strong> The <strong>FHIR Resource Server</strong>. Sent in <code className="text-slate-200">Authorization: Bearer ...</code> to fetch clinical resources.
                    </p>
                    <div className="p-2 rounded bg-slate-900 border border-slate-800 font-mono text-[11px] text-emerald-200">
                      aud: "https://api.mock.health/fhir"
                    </div>
                  </div>

                  <div
                    onClick={() => setDeepDiveTokenFocus("context")}
                    className={`p-4 rounded-2xl border cursor-pointer transition space-y-2 ${
                      deepDiveTokenFocus === "context"
                        ? "bg-sky-950/40 border-sky-400 shadow-lg shadow-sky-500/10"
                        : "bg-slate-950 border-slate-800 hover:border-slate-700"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 font-bold">
                        Path C • SMART Context
                      </span>
                      <HeartPulse className="w-4 h-4 text-sky-400" />
                    </div>
                    <div className="text-base font-bold text-white">
                      3. Patient & EHR Context
                    </div>
                    <p className="text-slate-300">
                      <strong>Requested via:</strong> <code className="text-sky-300">launch/patient</code> or <code className="text-sky-300">launch</code>
                    </p>
                    <p className="text-slate-400">
                      <strong>Consumed by:</strong> Both App & FHIR Server. Identifies whose medical chart is in context (<code className="text-slate-200">patient</code>, <code className="text-slate-200">encounter</code>, <code className="text-slate-200">need_patient_banner</code>).
                    </p>
                    <div className="p-2 rounded bg-slate-900 border border-slate-800 font-mono text-[11px] text-sky-200">
                      patient: "pat-mother-eleanor-456"
                    </div>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 bg-slate-950">
                        <th className="p-3">Feature</th>
                        <th className="p-3 text-indigo-300">ID Token (`id_token`)</th>
                        <th className="p-3 text-emerald-300">Access Token (`access_token`)</th>
                        <th className="p-3 text-amber-300">Refresh Token (`refresh_token`)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/70 text-slate-300">
                      <tr>
                        <td className="p-3 font-semibold text-white">Core Purpose</td>
                        <td className="p-3">Proof of Authentication (Who signed in)</td>
                        <td className="p-3">Delegated Authorization (What API calls are permitted)</td>
                        <td className="p-3">Obtain a new `access_token` when the current one expires</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-semibold text-white">Standard & Scope</td>
                        <td className="p-3 font-mono text-[11px]">OpenID Connect (`openid`, `fhirUser`)</td>
                        <td className="p-3 font-mono text-[11px]">OAuth 2.0 (`patient/*.rs`, `user/*.rs`)</td>
                        <td className="p-3 font-mono text-[11px]">OAuth 2.0 (`offline_access`)</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-semibold text-white">Format</td>
                        <td className="p-3">Always a signed JSON Web Token (JWT)</td>
                        <td className="p-3">JWT or Opaque Reference String</td>
                        <td className="p-3">Opaque String bound to Client ID</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-semibold text-white">Intended Audience (`aud`)</td>
                        <td className="p-3 font-mono text-indigo-300">Client App (`john-graph-app`)</td>
                        <td className="p-3 font-mono text-emerald-300">FHIR Server (`https://api.mock.health/fhir`)</td>
                        <td className="p-3 font-mono text-amber-300">Auth Server (`/smart/token`)</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
